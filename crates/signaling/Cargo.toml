[package]
name = "signaling"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
protocol = { version = "0.1.0", path = "../protocol" }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "sync", "net"] }
tower-http = { version = "0.7.1", features = ["fs"] }

[dev-dependencies]
futures-util = "0.3.34"
serde_json = "1.0.154"
tokio-tungstenite = "0.30.0"
