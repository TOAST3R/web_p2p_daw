[package]
name = "dsp"
version = "0.1.0"
edition = "2024"

[dependencies]
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Raw exports for the AudioWorklet build only; app links dsp as a normal library.
worklet = []
